<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private RSVP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Schermate universali */
    .screen {
      position: fixed;
      inset: 0;
      background: #000000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
      transition: opacity 0.35s ease;
      opacity: 0;
    }

    .screen.active {
      display: flex !important;
      opacity: 1 !important;
      z-index: 20;
    }

    /* Controllo audio discreto */
    .sound-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid #222222;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      font-size: 1.1rem;
      transition: transform 0.2s, background 0.2s;
    }
    .sound-toggle:active {
      transform: scale(0.9);
      background: #222222;
    }

    /* === STEP 1: PALLINO ROSSO === */
    .dot-container {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .red-dot {
      width: 52px;
      height: 52px;
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #d90429 80%);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(230, 0, 40, 0.75), 0 0 50px rgba(230, 0, 40, 0.45);
      animation: heartbeatPulse 1.25s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      transition: transform 0.15s ease;
    }

    .dot-container:active .red-dot {
      transform: scale(0.8) !important;
    }

    @keyframes heartbeatPulse {
      0% {
        transform: scale(0.65);
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
      }
      18% {
        transform: scale(1.55);
        box-shadow: 0 0 50px rgba(255, 30, 60, 0.95), 0 0 90px rgba(217, 4, 41, 0.6);
      }
      30% {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(217, 4, 41, 0.6);
      }
      44% {
        transform: scale(1.42);
        box-shadow: 0 0 45px rgba(255, 30, 60, 0.9), 0 0 80px rgba(217, 4, 41, 0.55);
      }
      65% {
        transform: scale(0.65);
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
      }
      100% {
        transform: scale(0.65);
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
      }
    }

    /* === Tasto Indietro === */
    .back-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #666666;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s;
    }
    .back-btn:hover, .back-btn:active {
      color: #ffffff;
    }

    /* === STEP 2: COORDINATE E PAROLA CHIAVE === */
    .step2-content {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .coords-link {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ff334b;
      text-decoration: none;
      text-shadow: 0 0 20px rgba(255, 51, 75, 0.6);
      transition: all 0.2s;
      padding: 8px 12px;
    }
    .coords-link:hover, .coords-link:active {
      color: #ff6b7e;
      text-shadow: 0 0 30px rgba(255, 51, 75, 0.9);
      transform: scale(1.03);
    }

    .keyword-form {
      width: 100%;
      display: flex;
      position: relative;
    }

    .keyword-input {
      width: 100%;
      padding: 16px 50px 16px 20px;
      background: #090909;
      border: 1px solid #202020;
      border-radius: 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      user-select: text;
    }
    .keyword-input:focus {
      border-color: #ff334b;
      box-shadow: 0 0 14px rgba(255, 51, 75, 0.3);
    }
    .keyword-input::placeholder {
      color: #444444;
    }

    .keyword-submit {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      background: transparent;
      border: none;
      color: #ff334b;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .keyword-submit:hover, .keyword-submit:active {
      background: #181818;
    }

    /* Animazione scuotimento errore */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: #ff1a38 !important;
      box-shadow: 0 0 14px rgba(255, 26, 56, 0.4) !important;
    }

    /* === STEP 3: FORM === */
    .step3-content {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contact-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      user-select: text;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      color: #999999;
      font-weight: 500;
      padding-left: 2px;
    }
    label span {
      color: #ff334b;
    }

    .form-input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid #222222;
      background-color: #0c0c0c;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      user-select: text;
    }
    .form-input:focus {
      border-color: #ff334b;
      box-shadow: 0 0 10px rgba(255, 51, 75, 0.25);
    }
    .form-input::placeholder {
      color: #444444;
    }

    .submit-btn {
      margin-top: 8px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff1a38, #c70020);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(217, 4, 41, 0.35);
      transition: transform 0.15s, opacity 0.2s;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* Box Successo */
    #success-box {
      display: none;
      width: 100%;
      text-align: center;
      padding: 40px
