<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private RSVP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Schermate */
    .screen {
      width: 100%;
      min-height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      background: #000000;
    }

    /* Step 1 è SEMPRE visibile di default */
    #screen-1 {
      display: flex;
    }

    /* Icona Mute audio in alto a destra */
    .sound-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid #222222;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      font-size: 1.1rem;
    }

    /* === STEP 1: PALLINO ROSSO === */
    .dot-box {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .red-dot {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #d90429 80%);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(230, 0, 40, 0.75), 0 0 50px rgba(230, 0, 40, 0.45);
      animation: heartPulse 1.25s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    @keyframes heartPulse {
      0% {
        transform: scale(0.65);
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
      }
      18% {
        transform: scale(1.55);
        box-shadow: 0 0 50px rgba(255, 30, 60, 0.95), 0 0 90px rgba(217, 4, 41, 0.6);
      }
      30% {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(217, 4, 41, 0.6);
      }
      44% {
        transform: scale(1.42);
        box-shadow: 0 0 45px rgba(255, 30, 60, 0.9), 0 0 80px rgba(217, 4, 41, 0.55);
      }
      65% {
        transform: scale(0.65);
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
      }
      100% {
        transform: scale(0.65);
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);
      }
    }

    /* === TASTO TORNA INDIETRO === */
    .back-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      background: transparent;
      border: none;
      color: #666666;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 8px;
    }
    .back-btn:hover, .back-btn:active {
      color: #ffffff;
    }

    /* === STEP 2: COORDINATE E PAROLA CHIAVE === */
    .step2-wrapper {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .coords-link {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ff334b;
      text-decoration: none;
      text-shadow: 0 0 20px rgba(255, 51, 75, 0.6);
      padding: 8px 12px;
    }

    .keyword-form {
      width: 100%;
      display: flex;
      position: relative;
    }

    .keyword-input {
      width: 100%;
      padding: 16px 50px 16px 20px;
      background: #090909;
      border: 1px solid #202020;
      border-radius: 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .keyword-input:focus {
      border-color: #ff334b;
      box-shadow: 0 0 14px rgba(255, 51, 75, 0.3);
    }
    .keyword-input::placeholder {
      color: #444444;
    }

    .keyword-submit {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      background: transparent;
      border: none;
      color: #ff334b;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: #ff1a38 !important;
    }

    /* === STEP 3: FORM === */
    .step3-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contact-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      color: #999999;
      font-weight: 500;
      padding-left: 2px;
    }
    label span {
      color: #ff334b;
    }

    .form-input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid #222222;
      background-color: #0c0c0c;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    .form-input:focus {
      border-color: #ff334b;
      box-shadow: 0 0 10px rgba(255, 51, 75, 0.25);
    }
    .form-input::placeholder {
      color: #444444;
    }

    .submit-btn {
      margin-top: 8px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff1a38, #c70020);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(217, 4, 41, 0.35);
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Box Successo */
    #success-box {
      display: none;
      width: 100%;
      text-align: center;
      padding: 40px 20px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .rsvp-text {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 51, 75, 0.5);
    }

    .rsvp-subtext {
      font-size: 0.85rem;
      color: #777777;
    }
  </style>
</head>
<body>

  <!-- Toggle Audio -->
  <button type="button" class="sound-toggle" id="audio-toggle">🔊</button>

  <!-- STEP 1: PALLINO ROSSO (visibile all'avvio) -->
  <div class="screen" id="screen-1">
    <div class="dot-box" id="dot-btn">
      <div class="red-dot"></div>
    </div>
  </div>

  <!-- STEP 2: COORDINATE E PAROLA CHIAVE -->
  <div class="screen" id="screen-2">
    <button type="button" class="back-btn" id="back-to-1">← Torna indietro</button>
    <div class="step2-wrapper">
      <a 
        href="https://www.google.com/maps/search/?api=1&query=45.5034492,9.2093117" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="coords-link">
        (45.5034492, 9.2093117)
      </a>

      <form class="keyword-form" id="keyword-form">
        <input 
          type="text" 
          id="keyword-input" 
          class="keyword-input" 
          placeholder="scrivi la parola chiave" 
          required 
          autocomplete="off"
          autocapitalize="off" 
          spellcheck="false">
        <button type="submit" class="keyword-submit" id="keyword-btn">➔</button>
      </form>
    </div>
  </div>

  <!-- STEP 3: MODULO ACCESSO -->
  <div class="screen" id="screen-3">
    <button type="button" class="back-btn" id="back-to-2">← Torna indietro
